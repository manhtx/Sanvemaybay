name: FlyCheap real-data pipeline

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force provider refresh for this run (uses provider quota)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */12 * * *"

jobs:
  scan-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run adaptive live pipeline
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
          TARGET_DEALS: "10"
          PIPELINE_MAX_CYCLES: "6"
          PIPELINE_ALLOW_BELOW_TARGET: "false"
          PIPELINE_FORCE_REFRESH: ${{ inputs.force_refresh || false }}
          SCAN_ROUTE_BATCH_COUNT: ${{ inputs.force_refresh && 88 || 12 }}
          PIPELINE_CYCLE_DELAY_MS: "15000"
        run: npm run pipeline:live
