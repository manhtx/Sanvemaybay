name: Deploy FlyCheap Supabase runtime

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment and Supabase target"
        required: true
        type: choice
        default: Preview
        options:
          - Preview
          - Production
      production_confirmation:
        description: "Type DEPLOY_PRODUCTION for a Production run"
        required: false
        type: string

concurrency:
  group: supabase-runtime-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Validate explicit environment boundary
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$EXPECTED_SUPABASE_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_SUPABASE_PROJECT_REF"
          if test "$TARGET_ENVIRONMENT" = "Production"; then
            test "$SOURCE_REF" = "refs/heads/main"
            test "$PRODUCTION_CONFIRMATION" = "DEPLOY_PRODUCTION"
          fi
      - name: Build release manifest
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: node scripts/release-manifest.mjs > release-manifest.json
      - name: Fail closed on migration-history drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > remote-migrations.json 2>/dev/null || supabase migration list --project-ref "$SUPABASE_PROJECT_REF" > remote-migrations.json
          node scripts/migration-parity.mjs remote-migrations.json
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > remote-functions.json 2>/dev/null || supabase functions list --project-ref "$SUPABASE_PROJECT_REF" > remote-functions.json
          node scripts/function-parity.mjs remote-functions.json
      - name: Configure project secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          APPROVED_BOOKING_HOSTS: ${{ vars.APPROVED_BOOKING_HOSTS }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          AI_EXPLANATION_BATCH_LIMIT: ${{ vars.AI_EXPLANATION_BATCH_LIMIT }}
          ANALYZE_FLIGHT_LIMIT: ${{ vars.ANALYZE_FLIGHT_LIMIT }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ALLOWED_HOSTNAMES: ${{ vars.TURNSTILE_ALLOWED_HOSTNAMES }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$INTERNAL_FUNCTION_SECRET"
          supabase secrets set INTERNAL_FUNCTION_SECRET="$INTERNAL_FUNCTION_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets set DEPLOYED_COMMIT="$DEPLOYED_COMMIT" --project-ref "$SUPABASE_PROJECT_REF"
          if test -n "$APPROVED_BOOKING_HOSTS"; then
            supabase secrets set APPROVED_BOOKING_HOSTS="$APPROVED_BOOKING_HOSTS" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$PUBLIC_SITE_URL"; then
            supabase secrets set PUBLIC_SITE_URL="$PUBLIC_SITE_URL" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$ALERT_FROM_EMAIL"; then
            supabase secrets set ALERT_FROM_EMAIL="$ALERT_FROM_EMAIL" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$RATE_LIMIT_SALT"; then
            supabase secrets set RATE_LIMIT_SALT="$RATE_LIMIT_SALT" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$TURNSTILE_SECRET_KEY"; then
            supabase secrets set TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$TURNSTILE_ALLOWED_HOSTNAMES"; then
            supabase secrets set TURNSTILE_ALLOWED_HOSTNAMES="$TURNSTILE_ALLOWED_HOSTNAMES" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$RESEND_API_KEY"; then
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$TELEGRAM_BOT_TOKEN"; then
            supabase secrets set TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          if test -n "$UNSUBSCRIBE_SECRET"; then
            supabase secrets set UNSUBSCRIBE_SECRET="$UNSUBSCRIBE_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          fi
          supabase secrets set AI_EXPLANATION_BATCH_LIMIT="${AI_EXPLANATION_BATCH_LIMIT:-20}" --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets set ANALYZE_FLIGHT_LIMIT="${ANALYZE_FLIGHT_LIMIT:-300}" --project-ref "$SUPABASE_PROJECT_REF"
          if test -n "$TRAVELPAYOUTS_TOKEN"; then
            supabase secrets set TRAVELPAYOUTS_TOKEN="$TRAVELPAYOUTS_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy runtime functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for function in flight-ingest analyze-price ai-explainer alert-processor setup-alert manage-alert manage-user-data feed-snapshot refresh-observed-fares observed-fares deal-redirect flight-search track-event retention-cleanup; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done
      - name: Smoke test public runtime boundaries
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          feed_status=$(curl -sS -o /tmp/feed-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/feed-snapshot" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')
          test "$feed_status" = "200"
          grep -q '"deals"' /tmp/feed-response.json

          outbound_date=$(date -u -d '+30 days' +%F)
          return_date=$(date -u -d '+37 days' +%F)
          search_status=$(curl -sS -o /tmp/search-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/flight-search" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"origin\":\"HAN\",\"destination\":\"BKK\",\"outbound_date\":\"$outbound_date\",\"return_date\":\"$return_date\"}")
          case "$search_status" in
            200|429|503) ;;
            *) cat /tmp/search-response.json; exit 1 ;;
          esac
      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flycheap-${{ inputs.target_environment }}-${{ github.sha }}
          path: |
            release-manifest.json
            remote-migrations.json
            remote-functions.json
          if-no-files-found: error
          retention-days: 90
