name: Import SerpApi historical archives

on:
  workflow_dispatch:
    inputs:
      archive_urls:
        description: "One or more SerpApi archive JSON URLs, one per line"
        required: true
        type: string

jobs:
  import-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Import verified historical archives
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
          ARCHIVE_URLS: ${{ inputs.archive_urls }}
        run: |
          node --input-type=module <<'NODE'
          const urls = process.env.ARCHIVE_URLS.split(/\r?\n/).map((value) => value.trim()).filter(Boolean);
          const response = await fetch(`${process.env.SUPABASE_URL}/functions/v1/archive-import`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: process.env.SUPABASE_ANON_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_ANON_KEY}`,
              "x-internal-secret": process.env.INTERNAL_FUNCTION_SECRET,
            },
            body: JSON.stringify({ archives: urls }),
          });
          const body = await response.text();
          console.log(body);
          if (!response.ok) process.exit(1);
          NODE
